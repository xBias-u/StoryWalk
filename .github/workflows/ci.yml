name: StoryWalk CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django checks
        env:
          DEBUG: 'True'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        env:
          DEBUG: 'True'
        run: python manage.py test --verbosity 1
      - name: Production configuration
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-123456789
          ALLOWED_HOSTS: testserver
          CSRF_TRUSTED_ORIGINS: https://testserver
          SERVE_MEDIA_FILES: 'True'
          SECURE_HSTS_INCLUDE_SUBDOMAINS: 'True'
          SECURE_HSTS_PRELOAD: 'True'
        run: |
          DATABASE_URL="sqlite:///$RUNNER_TEMP/release.sqlite3" python manage.py check --deploy --fail-level WARNING
          DATABASE_URL="sqlite:///$RUNNER_TEMP/release.sqlite3" python manage.py collectstatic --noinput
